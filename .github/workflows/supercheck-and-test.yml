name: Run lint, build and tests

on:
  push:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: '22.x'
      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: log_silent=true npm run test
