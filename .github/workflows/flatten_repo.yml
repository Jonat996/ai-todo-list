name: 🦉 Flatten Repository

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatten-and-commit:
    name: Generate Flattened Repository File
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.PAT_FLATTEN || github.token }}
          # PAT_FLATTEN must have 'repo' scope and admin/bypass permissions for protected branches
          # Falls back to GITHUB_TOKEN for manual workflow_dispatch executions

      - name: Generate flattened file
        run: |
          echo "🔍 Starting flatten process..."
          
          # Generate filename with repo name and timestamp
          REPO_NAME=$(echo "$GITHUB_REPOSITORY" | cut -d'/' -f2)
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          OUTPUT_FILE="flattened_${REPO_NAME}_${TIMESTAMP}.txt"
          
          echo "📝 Output file will be: $OUTPUT_FILE"
          
          # Configure environment variables for the flatten script
          export PARAM_IGNORE_DIRS="node_modules,bower_components,dist,build,out,.next,.nuxt,.svelte-kit,coverage,.idea,.vscode,.fleet,.venv,venv"
          export PARAM_IGNORE_FILENAMES="package-lock.json,yarn.lock,pnpm-lock.yaml"
          export PARAM_IGNORE_EXTS="map,tsbuildinfo,log,lock,db,sqlite,sqlite3,dump,lcov"
          export PARAM_IGNORE_ENV_PATTERNS=".env*"
          
          # Make script executable and run it
          chmod +x scripts/flatten_repo.sh
          ./scripts/flatten_repo.sh "$OUTPUT_FILE"
          
          # Add metadata header to the file (prepend to existing content)
          TEMP_FILE="${OUTPUT_FILE}.tmp"
          {
            echo "=================================="
            echo "FLATTENED: $REPO_NAME"
            echo "Generated at: $(date)"
            echo "Branch: ${GITHUB_REF##*/}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "=================================="
            echo ""
            cat "$OUTPUT_FILE"
          } > "$TEMP_FILE"
          mv "$TEMP_FILE" "$OUTPUT_FILE"
          
          # Save output filename for next step
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: Validate generated file
        run: |
          echo "🔍 Validating generated file: $OUTPUT_FILE"
          
          # Check if file exists
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ ERROR: Output file was not created!"
            exit 1
          fi
          
          # Check if file is not empty and has reasonable size
          FILE_SIZE=$(wc -c < "$OUTPUT_FILE")
          echo "📊 File size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "❌ ERROR: File is too small ($FILE_SIZE bytes). Expected at least 1000 bytes."
            exit 1
          fi
          
          # Verify header exists
          if ! head -n 5 "$OUTPUT_FILE" | grep -q "FLATTENED:"; then
            echo "❌ ERROR: File header is missing or malformed!"
            exit 1
          fi
          
          echo "✅ File validation passed"
          echo "📄 First 15 lines:"
          head -n 15 "$OUTPUT_FILE"

      - name: Commit and push flattened file
        run: |
          echo "🔧 Configuring git..."
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          echo "📋 Tracked flattened files before cleanup:"
          git ls-files 'flattened*.txt' 'repository_flattened.txt' 'flattened_output.txt' 2>/dev/null || echo "No old flattened files found"
          
          echo "🗑️ Removing old flattened files (keeping only the newest)..."
          # Remove all tracked flattened files except the current one
          git ls-files 'flattened*.txt' 'repository_flattened.txt' 'flattened_output.txt' 2>/dev/null | \
            grep -v "^$OUTPUT_FILE$" | \
            xargs -r git rm -f
          
          echo "📋 Tracked flattened files after cleanup:"
          git ls-files 'flattened*.txt' 2>/dev/null || echo "Only new file remains"
          
          echo "➕ Adding new flattened file: $OUTPUT_FILE"
          git add -f "$OUTPUT_FILE"
          
          echo "📊 Git diff summary:"
          git diff --staged --stat
          
          echo "📊 Detailed changes:"
          git status --short
          
          if git diff --staged --quiet; then
            echo "⚠️  No changes to commit."
          else
            echo "💾 Committing changes..."
            # Always include [skip ci] to prevent infinite loops
            # This workflow should not trigger itself
            git commit -m "docs: Update flattened repository file [skip ci]" \
                       -m "Generated at: $(date)" \
                       -m "Branch: ${GITHUB_REF##*/}" \
                       -m "Commit: ${GITHUB_SHA}" \
                       -m "Auto-generated by GitHub Actions workflow"
            
            echo "🚀 Pushing to remote..."
            git push
            echo "✅ Changes pushed successfully!"
          fi
